# Streamlit configuration — local-only, no telemetry.
[server]
address = "127.0.0.1"
port = 8501
headless = true
fileWatcherType = "none"
maxUploadSize = 200

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8501

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4F46E5"
font = "sans-serif"
